name: Calibrar contra el portafolio

on:
  workflow_dispatch:   # se corre a mano cuando cambia la tesis o la rúbrica

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Calibrar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python calibrate.py
      - name: Guardar resultados
        run: |
          git config user.name "latin-leap-scout[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calibration.json calibration.json
          git diff --cached --quiet || git commit -m "Calibración $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
