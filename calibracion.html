<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbral de fit</title>
<meta name="description" content="Cómo se fija el umbral de fit de Latin Leap Scout con el portafolio real del fondo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f6f3;--panel:#ffffff;--ink:#141414;--muted:#6b6b66;--line:#e4e4de;
  --accent:#c8d900;--accent-ink:#141414;--accent-soft:#f3f7c7;--accent-line:#8a9600;
  --good:#1f7a4d;--good-soft:#e2f3ea;--bad:#a23b3b;--bad-soft:#f8e3e3;--dot-ctrl:#b9b9b1;--dot-deal:#4a6fa5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0e;--panel:#191917;--ink:#f1f1ec;--muted:#9a9a92;--line:#2c2c29;
  --accent:#d7e83a;--accent-soft:#2d3110;--accent-line:#d7e83a;--good:#5fd39a;--good-soft:#14281d;--bad:#ef8a8a;--bad-soft:#301818;
  --dot-ctrl:#5c5c56;--dot-deal:#8fb3e8;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0f0f0e;--panel:#191917;--ink:#f1f1ec;--muted:#9a9a92;--line:#2c2c29;
  --accent:#d7e83a;--accent-soft:#2d3110;--accent-line:#d7e83a;--good:#5fd39a;--good-soft:#14281d;--bad:#ef8a8a;--bad-soft:#301818;
  --dot-ctrl:#5c5c56;--dot-deal:#8fb3e8;--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
a{color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;font-size:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.mark{width:22px;height:22px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,62% 100%,62% 38%,0 38%)}
h1{font-size:30px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 24px;max-width:700px;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.hero{display:grid;grid-template-columns:240px 1fr;gap:12px;margin-bottom:12px}
.big{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.big .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.big .val{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:6px 0}
.big .val small{font-size:22px;font-weight:600;opacity:.6}
.big p{margin:0;font-size:14px;opacity:.85}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat .n{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
h2{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
section{margin-top:12px}
svg text{font-family:Inter,system-ui,sans-serif}
.slider-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
input[type=range]{flex:1;min-width:200px;accent-color:var(--accent-line)}
.pill{font-family:"JetBrains Mono",monospace;font-weight:500;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:8px}
.whatif{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.wi .l{font-size:13px;color:var(--muted)}
.wi .names{font-size:13px;margin-top:8px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.fitcell{font-family:"JetBrains Mono",monospace;font-weight:500;padding:2px 8px;border-radius:7px}
.over{background:var(--accent);color:var(--accent-ink)}
.under{background:var(--line);color:var(--muted)}
.ctrl{color:var(--muted)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--bad-soft);color:var(--bad);margin-left:6px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step .k{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted)}
.step b{display:block;margin:2px 0 4px}
.step span{font-size:13.5px;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin-top:12px}
.tablewrap{overflow-x:auto}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .steps{grid-template-columns:1fr 1fr}
  .whatif{grid-template-columns:1fr}
  .hide-sm{display:none}
}
@media (max-width:480px){.steps{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark"></span>Latin Leap Scout</div>
    <a href="./">← Volver al dashboard</a>
  </div>

  <h1>Cómo se fija el umbral de fit</h1>
  <p class="lead">El umbral no es un número arbitrario: sale del portafolio real de Latin Leap. Es el nivel de fit que superan 3 de cada 4 inversiones que el fondo ya hizo.</p>

  <div id="app"><p class="sub">Cargando calibración…</p></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RUB = [["equipo","Equipo",30],["sector","Sector",20],["modelo","Modelo",10],["traccion","Tracción",20]];
let C = null, D = null;

async function getJSON(u){ try { const r = await fetch(u, {cache:"no-store"}); return r.ok ? await r.json() : null; } catch { return null; } }

async function load(){
  [C, D] = await Promise.all([getJSON("calibration.json"), getJSON("data.json")]);
  if (!C) { $("#app").innerHTML = '<p class="sub">Aún no hay calibración: corre el workflow "Calibrar contra el portafolio".</p>'; return; }
  const port = C.resultados.filter(r => r.grupo === "portafolio").sort((a,b) => b.fit - a.fit);
  const ctrl = C.resultados.filter(r => r.grupo === "control");
  const deals = (D?.deals || []).filter(d => d.accion !== "descartar" && !d.en_portafolio);
  const thr = C.umbral_fit, asc = port.map(r => r.fit).sort((a,b) => a - b);

  $("#app").innerHTML = `
  <div class="hero">
    <div class="card big">
      <div class="label">Umbral de prioridad</div>
      <div class="val">${thr}<small>/80</small></div>
      <p>Percentil 25 del fit del portafolio</p>
    </div>
    <div class="stats">
      <div class="card stat"><div class="n">${C.fit_promedio_portafolio}</div><div class="l">fit promedio del portafolio real</div></div>
      <div class="card stat"><div class="n">${C.fit_promedio_controles}</div><div class="l">fit promedio de controles fuera de tesis</div></div>
      <div class="card stat"><div class="n">${esc(C.portafolio_aprobado)}</div><div class="l">inversiones reales sobre el umbral</div></div>
      <div class="card stat"><div class="n">${esc(C.controles_rechazados)}</div><div class="l">controles rechazados</div></div>
    </div>
  </div>

  <section class="card">
    <h2>El portafolio y los controles caen en lados opuestos</h2>
    <p class="sub">Cada punto es una empresa calificada con la misma rúbrica. Fit = equipo + sector + modelo + tracción, de 0 a 80.</p>
    <div id="strip"></div>
  </section>

  <section class="card">
    <h2>¿Qué pasa si movemos el umbral?</h2>
    <p class="sub">Un umbral más alto deja menos deals de prioridad, pero también deja fuera inversiones que el fondo sí hizo.</p>
    <div class="slider-row">
      <span>Umbral</span>
      <input type="range" id="thr" min="30" max="70" step="1" value="${thr}" aria-label="Umbral de fit">
      <span class="pill" id="thr-v">${thr}/80</span>
    </div>
    <div class="whatif">
      <div class="card wi"><div class="n" id="wi-port"></div><div class="l">inversiones reales que lo superan</div><div class="names" id="wi-port-n"></div></div>
      <div class="card wi"><div class="n" id="wi-deal"></div><div class="l">deals nuevos de prioridad (de ${deals.length} en el pipeline)</div><div class="names" id="wi-deal-n"></div></div>
    </div>
  </section>

  <section class="card">
    <h2>Las ${port.length} inversiones reales, criterio por criterio</h2>
    <p class="sub">Calificadas como eran en su ronda semilla. El timing se excluye porque hoy están en etapas posteriores.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Empresa</th><th class="hide-sm">País</th><th class="hide-sm">Sector</th>${RUB.map(([,l,m]) => `<th class="num">${l} <span class="hide-sm">/${m}</span></th>`).join("")}<th class="num">Fit /80</th></tr></thead>
      <tbody id="tb"></tbody>
    </table></div>
    <p class="note">Controles fuera de tesis: ${ctrl.map(r => `${esc(r.nombre)} (${esc(r.pais)}, fit ${r.fit})`).join(" · ")}. Los tres fallan el filtro de geografía y se descartan.</p>
  </section>

  <section>
    <div class="steps">
      <div class="card step"><span class="k">01</span><b>Mismo flujo</b><span>Cada empresa del portafolio pasa por la misma investigación web y la misma rúbrica que una startup nueva.</span></div>
      <div class="card step"><span class="k">02</span><b>Sin timing</b><span>Se califica como era en su ronda semilla, para medir solo qué tan bien encaja con la tesis.</span></div>
      <div class="card step"><span class="k">03</span><b>Percentil 25</b><span>Ordenados los fits de menor a mayor (${asc.join(", ")}), el umbral es el valor que deja 3 de cada 4 por encima: ${thr}.</span></div>
      <div class="card step"><span class="k">04</span><b>Se recalcula</b><span>Al correr el workflow "Calibrar" el umbral se actualiza solo y el dashboard lo aplica en la siguiente corrida.</span></div>
    </div>
    <p class="note">Calibración del ${esc(C.generado.slice(0,10))} · costo estimado US$${Number(C.costo_usd).toFixed(2)}. La inversión menos afín (${esc(asc.length ? port.at(-1).nombre : "")}, fit ${asc.at(0)}) muestra que el fondo también decide por factores que no están en fuentes públicas: el umbral es un primer filtro, no una decisión.</p>
  </section>`;

  $("#tb").innerHTML = port.map(r => `<tr>
    <td><b>${esc(r.nombre)}</b></td><td class="hide-sm">${esc(r.pais)}</td><td class="hide-sm">${esc(r.sector)}</td>
    ${RUB.map(([k]) => `<td class="num">${r.puntajes?.[k] ?? "—"}</td>`).join("")}
    <td class="num"><span class="fitcell ${r.fit >= thr ? "over" : "under"}">${r.fit}</span></td></tr>`).join("");

  const update = () => {
    const t = Number($("#thr").value);
    $("#thr-v").textContent = `${t}/80`;
    const p = port.filter(r => r.fit >= t), d = deals.filter(x => x.fit >= t).sort((a,b) => b.fit - a.fit);
    $("#wi-port").textContent = `${p.length} de ${port.length}`;
    $("#wi-port-n").textContent = port.filter(r => r.fit < t).length ? "Quedan fuera: " + port.filter(r => r.fit < t).map(r => r.nombre).join(", ") : "Ninguna queda fuera.";
    $("#wi-deal").textContent = d.length;
    $("#wi-deal-n").textContent = d.length ? d.map(x => `${x.nombre} (${x.fit})`).join(", ") : "Ningún deal nuevo alcanza este umbral.";
    strip(port, ctrl, deals, t);
  };
  $("#thr").addEventListener("input", update);
  let rw; window.addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(update, 150); });
  update();
}

function strip(port, ctrl, deals, t){
  const narrow = window.innerWidth < 620, W = narrow ? 440 : 880, L = narrow ? 0 : 150, R = 18, H = 210;
  const X = v => L + 12 + (W - L - R - 12) * v / 80;
  const rows = [["Portafolio real", port, "var(--accent-line)", 50], ["Deals nuevos", deals, "var(--dot-deal)", 105], ["Controles", ctrl, "var(--dot-ctrl)", 160]];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Distribución del fit: portafolio, deals nuevos y controles">`;
  for (let v = 0; v <= 80; v += 10) s += `<line x1="${X(v)}" x2="${X(v)}" y1="26" y2="180" stroke="var(--line)"/><text x="${X(v)}" y="200" text-anchor="middle" font-size="12" fill="var(--muted)">${v}</text>`;
  rows.forEach(([name, list, color, y]) => {
    s += narrow ? `<text x="0" y="${y - 14}" font-size="13" font-weight="600" fill="var(--ink)">${name}</text>` : `<text x="0" y="${y + 4}" font-size="13.5" font-weight="600" fill="var(--ink)">${name}</text>`;
    const seen = {};
    list.forEach(r => { const k = r.fit; seen[k] = (seen[k] || 0) + 1; const dy = (seen[k] - 1) * 7 * (seen[k] % 2 ? 1 : -1);
      s += `<circle cx="${X(r.fit)}" cy="${y + dy}" r="6.5" fill="${color}" fill-opacity="${r.fit >= t ? 0.95 : 0.35}" stroke="${color}"><title>${esc(r.nombre)}: fit ${r.fit}</title></circle>`; });
  });
  s += `<line x1="${X(t)}" x2="${X(t)}" y1="18" y2="182" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  s += `<text x="${X(t) + 6}" y="20" font-size="12.5" font-weight="600" fill="var(--ink)">umbral ${t}</text>`;
  $("#strip").innerHTML = s + "</svg>";
}
load();
</script>
</body>
</html>
