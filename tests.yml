name: Pruebas

on:
  push:
    paths: ["scout/**", "tests/**", "requirements.txt"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prueba de punta a punta sin API (simulada)
        run: python -m tests.offline_test
